<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Story Lv. 6</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Pixelify+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen pixel world on a canvas; MapleStory-style UI windows float above it. Single deliberate look. */
:root{
  --ink:#251f38;
  --frame:#3e4b6e;
  --frame-hi:#c8d3ea;
  --paper:#ffffff;
  --paper-2:#eaf0fa;
  --gold:#ffd23f;
  --gold-deep:#b86e00;
  --btn-top:#ffc85a;
  --btn-bot:#f0861c;
  --btn-edge:#8a4206;
  --blue-top:#8cc2ff;
  --blue-bot:#3a76e0;
  --blue-edge:#1d3f86;
  --ok:#2fbf6a;
  --bad:#e5485c;
  --rose:#ff6f9c;
  --night:#17132b;
  --muted:#5b6380;
  --display:"Pixelify Sans","Courier New",monospace;
  --text:"DotGothic16","Trebuchet MS","Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;overflow:hidden;background:var(--night);color:var(--ink);font-family:var(--text);-webkit-tap-highlight-color:transparent;}
#world{position:fixed;left:0;top:0;image-rendering:pixelated;image-rendering:crisp-edges;display:block;}
#ui{position:fixed;inset:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));}
#ui > *{pointer-events:auto;}
#ui .passive{pointer-events:none;}
button{font:inherit;cursor:pointer;}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ---------- HUD ---------- */
#hud{position:absolute;top:calc(env(safe-area-inset-top,0px) + 10px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;gap:10px;}
.lv{display:flex;align-items:baseline;gap:3px;background:linear-gradient(#4a587e,#2b3452);border:2px solid #1a2036;border-radius:8px;padding:2px 9px 3px;box-shadow:inset 0 1px 0 #7d8cb5,0 2px 0 rgba(0,0,0,.35);}
.lv span{font-family:var(--display);font-size:12px;color:#ffe9a3;}
.lv b{font-family:var(--display);font-size:24px;line-height:1;color:var(--gold);text-shadow:2px 2px 0 #6b3b00;}
.lv.pop{animation:lvpop .6s ease-out;}
@keyframes lvpop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.who-hud{flex:1;min-width:0;max-width:260px;}
#pname{font-family:var(--display);font-weight:600;font-size:15px;color:#fff;text-shadow:1px 1px 0 #000,-1px 0 0 #000,0 -1px 0 #000,1px 0 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.expbar{position:relative;height:12px;margin-top:3px;background:#2a2238;border:2px solid #120e1d;border-radius:4px;overflow:hidden;}
.expbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(#fff3a0,#f1cc2b 55%,#d9a90c);transition:width .8s cubic-bezier(.3,.7,.3,1);}
.expbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:10px;color:#fff;text-shadow:1px 1px 0 #000;letter-spacing:.04em;}
.iconbtn{margin-left:auto;width:38px;height:34px;border-radius:8px;border:2px solid #1a2036;background:linear-gradient(#4a587e,#2b3452);color:#ffe9a3;font-family:var(--display);font-size:16px;box-shadow:inset 0 1px 0 #7d8cb5,0 2px 0 rgba(0,0,0,.35);}
.iconbtn[aria-pressed="false"]{color:#8a93ad;text-decoration:line-through;}

#nowPlaying{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 52px);font-family:var(--display);font-size:13px;color:#fff;background:rgba(20,16,40,.72);border:1px solid rgba(255,255,255,.25);border-radius:12px;padding:3px 10px;opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .4s;max-width:70%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#nowPlaying.show{opacity:1;transform:none;}
/* ---------- map banner ---------- */
#banner{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 62px);transform:translateX(-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;width:max-content;max-width:calc(100% - 32px);}
#banner.show{opacity:1;}
#banner .world{font-family:var(--display);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#ffe9a3;text-shadow:1px 1px 0 #000;}
#banner .map{font-family:var(--display);font-weight:700;font-size:clamp(20px,5vw,30px);color:#fff;text-shadow:2px 2px 0 #2a1d4a,-1px -1px 0 #2a1d4a,1px -1px 0 #2a1d4a,-1px 1px 0 #2a1d4a;text-wrap:balance;}

/* ---------- windows ---------- */
.win{position:absolute;left:50%;transform:translateX(-50%);width:min(660px,calc(100% - 32px));background:linear-gradient(var(--paper),var(--paper-2));border:3px solid var(--frame);border-radius:12px;box-shadow:inset 0 0 0 2px #fff,inset 0 0 0 4px var(--frame-hi),0 6px 0 rgba(10,8,25,.45),0 12px 30px rgba(0,0,0,.35);color:var(--ink);}
.win.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 14px);}
.win.center{top:50%;transform:translate(-50%,-50%);max-height:calc(100% - 40px);overflow:auto;}
.win.enter{animation:winIn .28s cubic-bezier(.2,.9,.3,1.2);}
.win.center.enter{animation:winInC .28s cubic-bezier(.2,.9,.3,1.2);}
@keyframes winIn{from{transform:translate(-50%,24px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
@keyframes winInC{from{transform:translate(-50%,-46%);opacity:0}to{transform:translate(-50%,-50%);opacity:1}}
.titlebar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:linear-gradient(#5b6b96,#3a4670);color:#fff;border-radius:8px 8px 0 0;font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;text-shadow:1px 1px 0 #1a2036;}
.titlebar .grow{flex:1;}

/* dialog */
.dlg{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px 16px 12px;cursor:pointer;}
.dlg.narr{grid-template-columns:1fr;}
.dlg .face{display:flex;flex-direction:column;align-items:center;gap:6px;}
.dlg canvas{width:72px;height:96px;image-rendering:pixelated;background:radial-gradient(circle at 50% 60%,#fff 0,#dfe7f6 70%);border:2px solid var(--frame-hi);border-radius:8px;}
.dlg .tag{font-family:var(--display);font-size:12px;color:#fff;background:#2b3452;padding:2px 8px;border-radius:10px;white-space:nowrap;}
.dlg .txt{min-width:0;display:flex;flex-direction:column;gap:10px;}
.dlg p{margin:0;font-size:17px;line-height:1.55;min-height:3.1em;max-width:62ch;}
.dlg.narr p{font-size:17px;color:#3a3358;}
.dlg .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;}
.mbtn{font-family:var(--display);font-weight:600;font-size:15px;color:#fff;letter-spacing:.03em;text-shadow:1px 1px 0 var(--btn-edge);background:linear-gradient(var(--btn-top),var(--btn-bot));border:2px solid var(--btn-edge);border-radius:7px;padding:6px 16px;box-shadow:inset 0 1px 0 #ffe8b0,0 3px 0 var(--btn-edge);transition:transform .08s;}
.mbtn:hover{filter:brightness(1.07);}
.mbtn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #ffe8b0,0 1px 0 var(--btn-edge);}
.mbtn.blue{background:linear-gradient(var(--blue-top),var(--blue-bot));border-color:var(--blue-edge);text-shadow:1px 1px 0 var(--blue-edge);box-shadow:inset 0 1px 0 #d6e9ff,0 3px 0 var(--blue-edge);}
.mbtn.gray{background:linear-gradient(#f4f6fb,#c9d0df);border-color:#6b7590;color:#3a4260;text-shadow:none;box-shadow:inset 0 1px 0 #fff,0 3px 0 #6b7590;}
.mbtn.big{font-size:19px;padding:9px 24px;}
.blink{animation:blink 1s steps(2) infinite;}
@keyframes blink{50%{opacity:.35}}

/* quest window */
.quest .qbody{padding:14px 18px 16px;display:grid;gap:10px;}
.quest h3{margin:0;font-family:var(--display);font-size:22px;color:#2b3452;text-wrap:balance;}
.quest p{margin:0;font-size:16px;line-height:1.55;}
.bulb{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff7c2,#ffd23f 55%,#e6a100);box-shadow:0 0 8px #ffd23f;}
.reward{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted);}
.chip{display:inline-block;font-family:var(--display);font-size:13px;color:#5a3c00;background:#fff1c2;border:1px solid #e3b84a;border-radius:20px;padding:2px 10px;}

/* quiz */
.quiz .qbody{padding:12px 16px 16px;display:grid;gap:12px;}
.mon{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:13px;color:#fff;}
.hp{width:110px;height:10px;background:#2a1220;border:2px solid #120a10;border-radius:4px;overflow:hidden;}
.hp i{display:block;height:100%;background:linear-gradient(#ff8a8a,#e5485c);transition:width .5s;}
.qtext{margin:0;font-size:16px;line-height:1.5;color:#3a3358;}
.expr{font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:clamp(24px,5.5vw,32px);text-align:center;color:var(--ink);padding:6px 0;}
.expr sup{font-size:.6em;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;border-radius:9px;border:2px solid #9aa7c6;background:linear-gradient(#fff,#eef2fb);box-shadow:0 3px 0 #9aa7c6;color:var(--ink);font-family:"Times New Roman",Georgia,serif;font-style:italic;font-size:20px;min-width:0;}
.opt sup{font-size:.6em;}
.opt .k{flex:none;font-family:var(--display);font-style:normal;font-size:13px;width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:#fff;background:#3e4b6e;}
.opt:hover{border-color:#3e4b6e;}
.opt.right{background:linear-gradient(#e6ffef,#bff0d2);border-color:var(--ok);box-shadow:0 3px 0 #1f8a4b;}
.opt.wrong{background:linear-gradient(#fff0f2,#ffd3da);border-color:var(--bad);box-shadow:0 3px 0 #a02a3b;animation:shake .35s;}
.opt:disabled{cursor:default;}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
@media (min-width:720px){.opts{grid-template-columns:repeat(4,1fr);}}
.hint{margin:0;font-size:15px;line-height:1.5;color:#8a2a3b;background:#fff0f2;border:1px dashed #e5485c;border-radius:8px;padding:8px 10px;}
.hint.good{color:#145c33;background:#e9fbf0;border-color:var(--ok);}

/* level up + banners */
#big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;}
.levelup{display:grid;justify-items:center;gap:4px;animation:lvIn 2.4s ease-out forwards;}
.levelup .rays{position:absolute;width:420px;height:420px;max-width:120vw;max-height:120vw;background:repeating-conic-gradient(rgba(255,226,120,.32) 0 10deg,transparent 10deg 20deg);border-radius:50%;mask:radial-gradient(circle,#000 20%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 6s linear infinite;z-index:-1;}
.levelup .t{position:relative;font-family:var(--display);font-weight:700;font-size:clamp(44px,12vw,84px);line-height:1;letter-spacing:.02em;background:linear-gradient(#fffbe0 10%,#ffd23f 45%,#ff9a1a 80%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #6b3200;filter:drop-shadow(0 4px 0 #6b3200);}
.levelup .s{font-family:var(--display);font-weight:600;font-size:clamp(16px,4vw,22px);color:#fff;text-shadow:2px 2px 0 #3a1d00;text-align:center;}
@keyframes lvIn{0%{transform:scale(.3);opacity:0}12%{transform:scale(1.15);opacity:1}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-30px)}}
@keyframes spin{to{transform:rotate(360deg)}}
.qc{font-family:var(--display);font-weight:700;font-size:clamp(28px,8vw,52px);color:#fff;-webkit-text-stroke:2px #1d3f86;text-shadow:0 4px 0 #1d3f86;background:linear-gradient(90deg,transparent,rgba(30,50,120,.75) 20%,rgba(30,50,120,.75) 80%,transparent);padding:6px 60px;animation:lvIn 2s ease-out forwards;text-align:center;}

/* damage numbers */
.dmg{position:absolute;font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;background:linear-gradient(#fff4a8 15%,#ffb12b 55%,#ff5a1a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #4a1500;pointer-events:none;animation:dmgUp 1.1s ease-out forwards;transform:translateX(-50%);white-space:nowrap;}
.dmg.crit{font-size:46px;background:linear-gradient(#ffe0f0 10%,#ff6f9c 55%,#c2185b);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px #4a0020;}
.dmg.miss{background:linear-gradient(#e8f1ff,#8fb2e8);-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:1.5px #1d3f86;font-size:30px;}
@keyframes dmgUp{0%{opacity:0;margin-top:10px}15%{opacity:1;margin-top:-6px}70%{opacity:1}100%{opacity:0;margin-top:-50px}}

/* title */
#title{position:absolute;inset:0;display:grid;justify-items:center;align-content:start;padding-top:calc(env(safe-area-inset-top,0px) + 9vh);text-align:center;}
#title .box{display:grid;justify-items:center;gap:14px;padding:0 8px;}
.logo{font-family:var(--display);font-weight:700;font-size:clamp(52px,15vw,110px);line-height:.9;background:linear-gradient(#fff 8%,#ffe27a 40%,#ff9f2e 75%,#ff6f9c);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px #3a1c4a;filter:drop-shadow(0 6px 0 #3a1c4a);animation:float 3s ease-in-out infinite;}
.logo small{display:block;font-size:.34em;letter-spacing:.12em;-webkit-text-stroke:2px #3a1c4a;margin-top:8px;}
@keyframes float{50%{transform:translateY(-6px)}}
.sub{font-family:var(--display);font-size:16px;color:#fff;text-shadow:2px 2px 0 #2a1d4a;}
.tiny{font-size:13px;color:#2a1d4a;background:rgba(255,255,255,.75);padding:3px 10px;border-radius:10px;}

/* photo memory */
.memory{text-align:center;padding:16px;display:grid;gap:10px;justify-items:center;}
.polaroid{background:#fff;padding:10px 10px 34px;box-shadow:0 8px 20px rgba(0,0,0,.3);transform:rotate(-2deg);position:relative;}
.polaroid img{display:block;height:min(52vh,420px);width:auto;max-width:100%;aspect-ratio:3/4;object-fit:cover;}
.polaroid figcaption{position:absolute;left:0;right:0;bottom:8px;font-family:var(--display);font-size:15px;color:#3a3358;}
.unlock{font-family:var(--display);font-size:16px;color:var(--gold-deep);}

/* spot the difference */
.mirror{width:min(1000px,calc(100% - 24px));}
.mirror .mbody{padding:10px 12px 14px;display:grid;gap:10px;}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,calc((100dvh - 230px) * 2.678 + 10px));margin:0 auto;}
.pic{position:relative;width:100%;aspect-ratio:1.339;border-radius:8px;overflow:hidden;border:3px solid #3e4b6e;cursor:crosshair;touch-action:manipulation;background:#000;}
.pic img{position:absolute;left:0;top:-14.2857%;width:100%;height:178.571%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none;}
@media (max-aspect-ratio:4/5){.pics{grid-template-columns:1fr;width:min(100%,calc((100dvh - 290px) / 2 * 1.339));}}
.pic .lab{position:absolute;left:6px;top:6px;font-family:var(--display);font-size:12px;color:#fff;background:rgba(20,16,40,.72);padding:2px 8px;border-radius:10px;pointer-events:none;}
.ring{position:absolute;border:3px solid #39ff9a;border-radius:50%;box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 12px #39ff9a;pointer-events:none;animation:ringIn .35s ease-out;}
.ring.hint{border-color:var(--gold);box-shadow:0 0 0 2px rgba(0,0,0,.45),0 0 14px var(--gold);animation:pulse .5s ease-in-out 4 alternate;}
@keyframes ringIn{from{transform:scale(1.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes pulse{from{transform:scale(.85)}to{transform:scale(1.1)}}
.xmark{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;pointer-events:none;animation:xfade .7s forwards;}
.xmark::before,.xmark::after{content:"";position:absolute;left:11px;top:0;width:4px;height:26px;background:var(--bad);border-radius:2px;box-shadow:0 0 0 1px #fff;}
.xmark::before{transform:rotate(45deg);} .xmark::after{transform:rotate(-45deg);}
@keyframes xfade{0%{opacity:1;transform:scale(.6)}30%{transform:scale(1.1)}100%{opacity:0}}
.hearts{display:flex;gap:4px;}
.heart{width:18px;height:16px;position:relative;}
.heart::before{content:"";position:absolute;inset:0;background:#c9cfdf;clip-path:path("M9 15 L2 8 C-1 5 1 0 5 1 C7 1.5 8.5 3 9 4 C9.5 3 11 1.5 13 1 C17 0 19 5 16 8 Z");}
.heart.on::before{background:var(--rose);}
.mirror .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;}
.mirror .note{font-size:14px;color:var(--muted);}

/* montage */
#montage{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 110px);transform:translateX(-50%);display:grid;gap:8px;width:min(340px,calc(100% - 32px));}
.bday{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.94);border:2px solid var(--frame);border-radius:10px;padding:7px 12px;font-family:var(--display);font-size:16px;color:var(--ink);animation:slideIn .4s cubic-bezier(.2,.9,.3,1.2);box-shadow:0 3px 0 rgba(0,0,0,.3);}
.bday .n{color:var(--gold-deep);font-weight:700;}
.bday .y{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;}
.bday .ck{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;font-size:13px;}
@keyframes slideIn{from{transform:translateX(-30px);opacity:0}to{transform:none;opacity:1}}

/* portals */
.portals{width:min(1000px,calc(100% - 24px));}
.portals .pbody{padding:12px;display:grid;gap:12px;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px;}
.card{display:grid;grid-template-rows:auto 1fr;border:2px solid #9aa7c6;border-radius:10px;overflow:hidden;background:#fff;box-shadow:0 3px 0 #9aa7c6;min-width:0;}
.card.watched{border-color:var(--frame);}
.thumb{position:relative;aspect-ratio:16/9;background:#000;overflow:hidden;cursor:pointer;}
.thumb canvas,.thumb img{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover;}
.thumb .play{position:absolute;inset:0;display:grid;place-items:center;}
.thumb .play b{width:52px;height:52px;border-radius:50%;background:rgba(20,16,40,.6);border:2px solid #fff;display:grid;place-items:center;}
.thumb .play b::before{content:"";margin-left:5px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;}
.thumb .seen{position:absolute;right:6px;top:6px;font-family:var(--display);font-size:11px;color:#fff;background:var(--ok);border-radius:10px;padding:2px 7px;}
.cinfo{padding:10px 12px 12px;display:grid;gap:6px;align-content:start;}
.cinfo h4{margin:0;font-family:var(--display);font-size:21px;color:var(--ink);line-height:1.1;}
.cinfo h4 small{display:block;font-size:13px;color:var(--muted);font-weight:500;margin-top:2px;}
.rate{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;}
.rate b{font-family:var(--display);font-size:17px;color:var(--ink);}
.stars{position:relative;display:inline-block;font-size:15px;letter-spacing:1px;color:#d6dbe7;line-height:1;}
.stars i{position:absolute;left:0;top:0;overflow:hidden;color:#f5b301;font-style:normal;white-space:nowrap;}
.cinfo .cu{font-size:14px;color:#3a3358;}
.cbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.src{font-size:12px;color:var(--muted);}
.src a{color:#3a76e0;}

/* trailer */
.trailer{width:min(820px,calc(100% - 20px));background:#0d0b18;border-color:#000;box-shadow:0 0 0 2px #3e4b6e,0 12px 40px rgba(0,0,0,.6);}
.tstage{position:relative;aspect-ratio:16/9;overflow:hidden;border-radius:9px 9px 0 0;background:#000;}
.tstage canvas,.tstage img.shot{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;object-fit:cover;transform-origin:50% 50%;}
.tstage .flash{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .25s;}
.segs{position:absolute;left:10px;right:10px;top:10px;display:flex;gap:4px;z-index:3;}
.segs span{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden;}
.segs span i{display:block;height:100%;width:0;background:#fff;}
.cap{position:absolute;left:0;right:0;bottom:0;padding:40px 18px 16px;background:linear-gradient(transparent,rgba(5,3,15,.85));color:#fff;z-index:2;}
.cap .ct{font-family:var(--display);font-weight:700;font-size:clamp(22px,5.5vw,38px);line-height:1.05;text-shadow:2px 2px 0 rgba(0,0,0,.6);animation:capIn .5s ease-out;}
.cap .cs{font-size:clamp(13px,3.2vw,17px);opacity:.92;margin-top:4px;animation:capIn .5s .15s ease-out both;max-width:60ch;}
@keyframes capIn{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.endcard{position:absolute;inset:0;z-index:4;display:grid;place-items:center;padding:14px;background:rgba(8,6,20,.55);}
.tstage.ending{aspect-ratio:auto;min-height:calc(min(820px,100vw - 20px) * 9 / 16);}
.tstage.ending .endcard{position:relative;inset:auto;min-height:inherit;}
.endcard .ec{background:rgba(255,255,255,.96);border-radius:12px;border:3px solid var(--frame);padding:14px 18px;display:grid;gap:8px;justify-items:center;text-align:center;width:min(420px,100%);animation:winInE .35s cubic-bezier(.2,.9,.3,1.2);}
@keyframes winInE{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.ec .big{font-family:var(--display);font-weight:700;font-size:clamp(40px,10vw,60px);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;}
.ec .stars{font-size:24px;}
.ec .vibes{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.tfoot{display:flex;gap:8px;justify-content:space-between;align-items:center;padding:10px 12px;flex-wrap:wrap;}
.tfoot .tname{font-family:var(--display);color:#fff;font-size:15px;}
.tfoot .grp{display:flex;gap:8px;flex-wrap:wrap;}

/* final plan */
.plan{width:min(560px,calc(100% - 24px));}
.plan .pb{padding:14px 18px 16px;display:grid;gap:12px;}
.plan h3{margin:0;font-family:var(--display);font-size:24px;color:#2b3452;text-wrap:balance;}
.plan .date{font-size:14px;color:var(--muted);}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:2px;position:relative;}
.steps li{display:grid;grid-template-columns:76px 18px 1fr;gap:10px;align-items:start;padding:7px 8px;border-radius:8px;opacity:0;transform:translateY(8px);transition:opacity .4s,transform .4s;}
.steps li.in{opacity:1;transform:none;}
.steps .tm{font-family:var(--display);font-weight:600;font-size:16px;color:var(--gold-deep);font-variant-numeric:tabular-nums;text-align:right;padding-top:1px;}
.steps .dot{width:14px;height:14px;margin-top:4px;border-radius:50%;background:#fff;border:3px solid #3e4b6e;}
.steps .what b{display:block;font-size:16px;color:var(--ink);font-weight:400;}
.steps .what span{font-size:13px;color:var(--muted);}
.steps li.pick{background:linear-gradient(90deg,#fff1c2,#ffe3ef);box-shadow:inset 0 0 0 2px #e3b84a;}
.steps li.pick .dot{background:var(--rose);border-color:#c2185b;}
.steps li.pick .what b{font-family:var(--display);font-weight:600;font-size:18px;}
.badge{display:inline-block;font-family:var(--display);font-size:11px;color:#fff;background:#c2185b;border-radius:10px;padding:1px 8px;margin-left:6px;vertical-align:2px;}
.share{display:grid;gap:8px;border-top:2px dashed #c8d3ea;padding-top:12px;}
.share .lbl{font-size:14px;color:var(--muted);}
.share .grp{display:flex;gap:8px;flex-wrap:wrap;}
.share a.mbtn{text-decoration:none;display:inline-block;}
.share code{display:block;font-family:var(--text);font-size:14px;background:#f2f5fb;border:1px solid #c8d3ea;border-radius:8px;padding:8px 10px;user-select:all;white-space:pre-wrap;}

.dim{position:absolute;inset:0;background:rgba(10,8,25,.55);}
@media (max-width:520px){
  .dlg{grid-template-columns:auto 1fr;gap:10px;padding:12px;}
  .dlg canvas{width:54px;height:72px;}
  .dlg p{font-size:16px;}
  .opts{gap:8px;}
  .opt{font-size:18px;padding:9px 10px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;}
}

function frame(t) {
  (SCENES[scene] || SCENES.campus)(g, t);
  const gy = GY();
  for (const a of actors) {
    if (a.alpha <= 0) continue;
    const x = ax(a), y = gy - Math.round(a.hop);
    let top = y - 22;
    if (a.kind === "her" || a.kind === "him") { const wf = a.walking && Math.floor(t / 150) % 2 === 1; top = drawPerson(g, a.kind, a.outfit, x, y, a.dir < 0, wf, a.cap); }
    else if (a.kind === "snail") { drawSnail(g, x, y, t, a.dir < 0); top = y - 22; }
    else if (a.kind === "slime") { drawSlime(g, x, y, t, a.flash > t, a.alpha); top = y - 26; }
    else if (a.kind === "scroll") { R(g, "#2b1e2a", x - 5, y - 6 - Math.round(Math.abs(Math.sin(t / 300)) * 2), 10, 6); R(g, "#fff3d6", x - 4, y - 5 - Math.round(Math.abs(Math.sin(t / 300)) * 2), 8, 4); R(g, "#d8343c", x - 1, y - 5 - Math.round(Math.abs(Math.sin(t / 300)) * 2), 2, 4); }
    if (a.emote && t - a.emoteT < 1600) {
      const ex = x - 4, ey = top - 11;
      R(g, "#2b1e2a", ex - 1, ey - 1, 11, 10); R(g, "#ffffff", ex, ey, 9, 8); R(g, "#ffffff", ex + 2, ey + 8, 2, 1); R(g, "#2b1e2a", ex + 2, ey + 9, 1, 1);
      if (a.emote === "!") { R(g, "#e5485c", ex + 4, ey + 1, 1, 4); R(g, "#e5485c", ex + 4, ey + 6, 1, 1); }
      else drawHeart(g, ex + 2, ey + 1, "#ff4f7f");
    }
  }
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.life--;
    if (p.life <= 0 || p.y > H + 5) { parts.splice(i, 1); continue; }
    const col = Array.isArray(p.col) ? p.col[p.life % 8 < 4 ? 0 : 1] : p.col;
    if (p.type === "heart") drawHeart(g, Math.round(p.x), Math.round(p.y), col);
    else if (p.type === "conf") R(g, col, p.x, p.y, (p.life >> 3) % 2 ? 2 : 1, (p.life >> 3) % 2 ? 1 : 2);
    else { g.globalAlpha = Math.min(1, p.life / 30); R(g, col, p.x, p.y, 1, 1); g.globalAlpha = 1; }
  }
  requestAnimationFrame(frame);
}

        (function cnt(now) { const k2 = Math.min(1, (now - st) / 1100), e = 1 - Math.pow(1 - k2, 3); const a = ec.querySelector("#rnum"), b = ec.querySelector("#rcnt"); if (!a) return; a.textContent = (r.rating * e).toFixed(1); b.textContent = fmt(Math.round(r.reviews * e)); if (k2 < 1) requestAnimationFrame(cnt); })(st);
        ec.querySelector('[data-a="pick"]').onclick = () => end("pick");
        ec.querySelector('[data-a="replay"]').onclick = () => { ec.remove(); stage.classList.remove("ending"); tc.style.transform = ""; win.querySelector('[data-a="skip"]').hidden = false; go(0); };
        win.querySelector('[data-a="skip"]').hidden = true;
      }
    }
    function end(v) { dead = true; cancelAnimationFrame(raf); keyHandler = null; d.remove(); win.remove(); resolve(v); }
    win.querySelector('[data-a="close"]').onclick = () => end("close");
    win.querySelector('[data-a="skip"]').onclick = () => { if (shot < 3) go(3); };
    keyHandler = () => { if (shot < 3) go(shot + 1); };
    go(0); raf = requestAnimationFrame(loop);
  });
}
function pickRestaurant() {
  return new Promise(resolve => {
    const watched = new Set(); setTrack("lounge");
    const win = document.createElement("div"); win.className = "win center enter portals";
    const d = document.createElement("div"); d.className = "dim";
    win.innerHTML = `<div class="titlebar"><span class="grow">CHOOSE TONIGHT'S DINNER · 6:30pm</span></div>
      <div class="pbody"><div class="cards">${RESTAURANTS.map(r => `
        <article class="card" data-id="${r.id}">
          <div class="thumb" role="button" tabindex="0" aria-label="Play ${esc(r.name)} preview"><canvas width="${TW}" height="${TH}"></canvas><div class="play"><b></b></div></div>
          <div class="cinfo"><h4>${esc(r.name)} <small>${esc(r.at)} · ${esc(r.cuisine)}</small></h4>
            <div class="rate"><b>${r.rating.toFixed(1)}</b>${starsHTML(r.rating)}<span>(${fmt(r.reviews)})</span></div>
            <div class="cu">${esc(r.dishes)}</div>
            <div class="cbtns"><button class="mbtn blue" data-a="watch">▶ Preview</button><button class="mbtn" data-a="pick">Pick this</button></div></div>
        </article>`).join("")}</div>
        <div class="src">Ratings: Google Maps, snapshot October 2026.</div></div>`;
    layer.append(d, win);
    win.querySelectorAll(".card").forEach(card => {
      const r = RESTAURANTS.find(x => x.id === card.dataset.id), c = card.querySelector("canvas");
      if (r.photos && r.photos.length) { const im = document.createElement("img"); im.src = r.photos[0]; im.alt = ""; c.replaceWith(im); } else SHOTS[r.id][0](c.getContext("2d"), 1200);
      const watch = async () => {
        win.style.visibility = "hidden"; d.style.visibility = "hidden";
        const v = await playTrailer(r);
        win.style.visibility = ""; d.style.visibility = "";
        watched.add(r.id); card.classList.add("watched");
        if (!card.querySelector(".seen")) card.querySelector(".thumb").insertAdjacentHTML("beforeend", `<span class="seen">WATCHED</span>`);
        if (v === "pick") choose(r);
      };
      card.querySelector(".thumb").onclick = watch;
      card.querySelector(".thumb").onkeydown = e => { if (e.key === "Enter") watch(); };
      card.querySelector('[data-a="watch"]').onclick = watch;
      card.querySelector('[data-a="pick"]').onclick = () => choose(r);
    });
    async function choose(r) {
      win.style.visibility = "hidden"; d.style.visibility = "hidden";
      const ok = await say("snail", `Lock in ${r.name} ${r.at} for dinner?`, [{ label: "Yes, this one!", value: true }, { label: "Let me rethink", value: false, cls: "gray" }]);
      if (ok) { win.remove(); d.remove(); resolve(r); } else { win.style.visibility = ""; d.style.visibility = ""; }
    }
  });
}

/* ---------------- final plan ---------------- */
function shareText(r) { return `Quest accepted! For my birthday dinner I pick ${r.name} ${r.at}. See you at ${CONFIG.plan[0].time}!`; }
async function finalPlan(r) {
  sfx("ok"); hearts(20); confetti(60); setTrack("romance");
  await say("him", `${r.name} it is. Good choice.`);
  await say("snail", "The final quest has been unlocked...");
  const win = document.createElement("div"); win.className = "win center enter plan";
  const items = CONFIG.plan.map(p => {
    const isDinner = p.title === "DINNER";
    const title = isDinner ? `${r.name} ${r.at}` : p.title;
    const note = isDinner ? `${r.cuisine} · ${r.area}` : p.note;
    return `<li class="${isDinner ? "pick" : ""}"><span class="tm">${esc(p.time)}</span><span class="dot"></span><span class="what"><b>${esc(title)}${isDinner ? `<span class="badge">YOUR PICK</span>` : ""}</b>${note ? `<span>${esc(note)}</span>` : ""}</span></li>`;
  }).join("");
  const wa = `https://wa.me/${CONFIG.whatsappNumber.replace(/\D/g, "")}?text=${encodeURIComponent(shareText(r))}`;
  const tgm = `https://t.me/share/url?url=${encodeURIComponent(" ")}&text=${encodeURIComponent(shareText(r))}`;
  win.innerHTML = `<div class="titlebar"><span class="bulb"></span><span class="grow">MAIN QUEST</span><span>Lv. ${ST.lv}</span></div>
    <div class="pb"><div><h3>Birthday Date with ${esc(CONFIG.hisName === "Me" ? "me" : CONFIG.hisName)}</h3><div class="date">${esc(CONFIG.dateLabel)}</div></div>
      <ol class="steps">${items}</ol>
      <div class="foot" style="display:flex;justify-content:flex-end" id="acceptRow"><button class="mbtn big" id="acceptBtn">Accept Quest</button></div>
      <div class="share" id="shareBox" hidden>
        <div class="lbl">Send your pick to him so he can book the table:</div>
        <div class="grp"><a class="mbtn" href="${wa}" target="_blank" rel="noopener">WhatsApp him</a><a class="mbtn blue" href="${tgm}" target="_blank" rel="noopener">Telegram him</a><button class="mbtn gray" id="copyBtn">Copy message</button></div>
        <code id="shareTxt">${esc(shareText(r))}</code>
        <div class="grp" style="justify-content:space-between;align-items:center"><span class="lbl">Or just screenshot this quest log.</span><button class="mbtn gray" id="replayBtn">Replay story</button></div>
      </div></div>`;
  layer.appendChild(win);
  const lis = [...win.querySelectorAll(".steps li")];
  for (const li of lis) { await sleep(350); li.classList.add("in"); sfx("blip"); }
  const acc = win.querySelector("#acceptBtn"); acc.focus({ preventScroll: true });
  await new Promise(res => { acc.onclick = res; keyHandler = res; }); keyHandler = null;
  sfx("lv"); hearts(24); confetti(80); fireworks = true; setTimeout(() => fireworks = false, 6000);
  win.querySelector("#acceptRow").remove(); win.querySelector("#shareBox").hidden = false;
  win.querySelector("#copyBtn").onclick = async e => {
    const b = e.currentTarget;
    try { await navigator.clipboard.writeText(shareText(r)); b.textContent = "Copied"; }
    catch (err) { const sel = getSelection(), rg = document.createRange(); rg.selectNodeContents(win.querySelector("#shareTxt")); sel.removeAllRanges(); sel.addRange(rg); b.textContent = "Selected, now copy"; }
  };
  win.querySelector("#replayBtn").onclick = () => { win.remove(); run("ch1"); };
  $("#big").innerHTML = `<div class="qc">QUEST ACCEPTED<div style="font-size:.42em;-webkit-text-stroke:0;text-shadow:1px 1px 0 #1d3f86">See you at ${esc(CONFIG.plan[0].time)}</div></div>`;
  setTimeout(() => $("#big").innerHTML = "", 2200);
}

/* ---------------- flow ---------------- */
async function run(from) {
  layer.innerHTML = ""; $("#big").innerHTML = ""; fireworks = false; props = {};
  $("#hud").hidden = false; $("#pname").textContent = CONFIG.herName;
  const order = ["ch1", "ch2", "ch3", "pick"];
  let i = Math.max(0, order.indexOf(from));
  ST.lv = [1, 2, 4, 6][i]; ST.exp = 0; hud();
  if (i <= 0) { await chapter1(); await battle(); }
  if (i <= 1) { await chapter2(); }
  if (i <= 2) { await montage(); await chapter3(); }
  if (i === 3) { scene = "birthday"; clearActors(); props.cake = { ox: 0 }; her = addActor("her", { ox: -SP() - 2, outfit: "date" }); him = addActor("him", { ox: SP() + 2, outfit: "date", dir: -1 }); }
  const r = await pickRestaurant();
  await finalPlan(r);
}
function titleScreen() {
  scene = "title"; clearActors();
  addActor("her", { ox: -9 }); addActor("him", { ox: 9, dir: -1 });
  const t = document.createElement("div"); t.id = "title";
  t.innerHTML = `<div class="box"><div class="logo">OUR STORY<small>LV. ${CONFIG.birthdaysTogether} · BIRTHDAY EDITION</small></div>
    <div class="sub">Player: ${esc(CONFIG.herName)}</div>
    <button class="mbtn big blink" id="startBtn">PRESS START</button>
    <div class="tiny">Turn your sound on</div></div>`;
  layer.appendChild(t);
  AU.name = ""; setTrack("title");
  const go = () => { keyHandler = null; setMusic(true); sfx("ok"); t.remove(); run(location.hash.replace("#", "")); };
  $("#startBtn").onclick = go; keyHandler = go;
}
titleScreen();
</script>
